<!DOCTYPE html>
<html>
<head>
<title>Jewel AI</title>
</head>
<body>
<h1>🤖 JEWEL AI</h1>
<p>Your Personal AI Assistant</p>
<input id="question" placeholder="Ask Jewel AI anything...">
<button onclick="askJewel()">Ask</button>
<p id="answer"></p>
<script>
function askJewel() {
let q = document.getElementById("question").value;
document.getElementById("answer").innerText =
"Jewel AI received: " + q;
}
</script>
</body>
</html>
